<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img">
  <title>Seni abstrak obsidian dan emas</title>
  <desc>Komposisi kaca skulptural gelap dengan pantulan emas hangat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="1" stop-color="#1C1C1C"/>
    </linearGradient>
    <radialGradient id="halo" cx="68%" cy="26%" r="58%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#D4AF37" stop-opacity=".12"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset=".45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8A6A1F"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2A2A" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity=".92"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="820" cy="230" rx="430" ry="330" fill="url(#halo)" filter="url(#blur)"/>
  <g opacity=".95">
    <polygon points="210,720 430,180 690,300 520,820" fill="url(#glass)" stroke="url(#gold)" stroke-opacity=".55" stroke-width="2"/>
    <polygon points="470,140 760,90 900,520 650,430" fill="url(#glass)" stroke="url(#gold)" stroke-opacity=".38" stroke-width="2"/>
    <polygon points="700,760 930,250 1120,470 950,850" fill="url(#glass)" stroke="url(#gold)" stroke-opacity=".45" stroke-width="2"/>
    <polygon points="120,470 330,300 430,610 260,760" fill="#141414" stroke="url(#gold)" stroke-opacity=".25" stroke-width="2"/>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M430 180 L690 300 L520 820" stroke-opacity=".7" stroke-width="3"/>
    <path d="M760 90 L900 520 L650 430" stroke-opacity=".5" stroke-width="2"/>
    <path d="M930 250 L1120 470 L950 850" stroke-opacity=".55" stroke-width="2"/>
  </g>
  <circle cx="690" cy="300" r="10" fill="#FFF3C4" filter="url(#soft)" opacity=".9"/>
  <circle cx="900" cy="520" r="6" fill="#D4AF37" filter="url(#soft)" opacity=".8"/>
  <rect width="1200" height="900" fill="none" stroke="#D4AF37" stroke-opacity=".08" stroke-width="2"/>
</svg>
