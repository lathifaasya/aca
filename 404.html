<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Halaman tidak ditemukan — Lathifa</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0B0B0B;
      color: #FFFFFF;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 560px; }
    .eyebrow { color: #D4AF37; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(40px, 10vw, 88px); margin: 12px 0; }
    p { color: #A3A3A3; line-height: 1.7; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 999px;
      background: #D4AF37;
      color: #0B0B0B;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #FFFFFF; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Kode 404</span>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda buka tidak tersedia di portofolio ini. Kembali ke halaman utama untuk melihat karya dan informasi kontak.</p>
    <a href="./">Kembali ke beranda</a>
  </main>
</body>
</html>
